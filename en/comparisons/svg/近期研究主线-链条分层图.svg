<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" role="img" aria-labelledby="title desc">
  <title id="title">近期研究主线 · 链条分层图</title>
  <desc id="desc">从需求锚到网络、算力、存储、封装制造、电力，再到平台现金流；每层风险收益不同。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#020617"/>
  <rect x="24" y="24" width="1332" height="892" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" filter="url(#shadow)"/>
<text x="58.0" y="70.0" fill="#e2e8f0" font-size="30" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="750" >近期研究主线 · 链条分层图</text>
<text x="58.0" y="100.0" fill="#94a3b8" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >从需求锚到网络、算力、存储、封装制造、电力，再到平台现金流；每层风险收益不同。</text>
  <rect x="58" y="138" width="1210" height="92" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="58" y="138" width="16" height="92" rx="8" fill="#f59e0b"/>
<text x="94.0" y="170.0" fill="#f59e0b" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >需求锚</text>
<text x="318.0" y="168.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >云/AI capex、agentic workflow、推理 scale-across</text>
<text x="318.0" y="194.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >ORCL / CSCO / AMD / DELL / hyperscaler prints</text>
<text x="878.0" y="184.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >需求真实；DELL 已到系统交付 revenue/guide，但不能自动变成 supplier share proof</text>
  <path d="M 94 234 L 94 258" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="244" width="1210" height="92" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="58" y="244" width="16" height="92" rx="8" fill="#38bdf8"/>
<text x="94.0" y="276.0" fill="#38bdf8" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >网络与互连</text>
<text x="318.0" y="274.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >scale-out、scale-across、DCI、800G/1.6T/3.2T</text>
<text x="318.0" y="300.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >CIEN / LITE / FN / CRDO / SMTC / MXL / ADTN</text>
<text x="878.0" y="290.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >已发现核心不追；hidden 名字 proof-first</text>
  <path d="M 94 340 L 94 364" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="350" width="1210" height="92" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="58" y="350" width="16" height="92" rx="8" fill="#f59e0b"/>
<text x="94.0" y="382.0" fill="#f59e0b" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >算力/定制硅</text>
<text x="318.0" y="380.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >custom ASIC、networking silicon、platform compute</text>
<text x="318.0" y="406.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >AVGO / MRVL / QCOM / TSM / NVDA / AMD</text>
<text x="878.0" y="396.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >直接性和估值舒适度必须分开</text>
  <path d="M 94 446 L 94 470" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="456" width="1210" height="92" rx="18" fill="#111827" stroke="#60a5fa" stroke-width="1.8"/>
  <rect x="58" y="456" width="16" height="92" rx="8" fill="#60a5fa"/>
<text x="94.0" y="488.0" fill="#60a5fa" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >存储与数据</text>
<text x="318.0" y="486.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >RAG、logs、checkpoint、nearline、datacenter flash</text>
<text x="318.0" y="512.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >SNDK / WDC / MU</text>
<text x="878.0" y="502.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >近端最强，不等于 HBM/substrate 级硬短缺</text>
  <path d="M 94 552 L 94 576" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="562" width="1210" height="92" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="1.8"/>
  <rect x="58" y="562" width="16" height="92" rx="8" fill="#a78bfa"/>
<text x="94.0" y="594.0" fill="#a78bfa" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >封装/制造/系统交付</text>
<text x="318.0" y="592.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >HBM stack、CoWoS/SoIC、ABF/FC-BGA、EMS/rack-scale delivery、probe-test</text>
<text x="318.0" y="618.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >TSM / AT&amp;S / Nan Ya / Unimicron / CLS / FN / SANM</text>
<text x="878.0" y="608.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >硬瓶颈与系统交付分开；AT&amp;S等 proof closure，CLS是wrong-frame兑现层</text>
  <path d="M 94 658 L 94 682" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="668" width="1210" height="92" rx="18" fill="#111827" stroke="#34d399" stroke-width="1.8"/>
  <rect x="58" y="668" width="16" height="92" rx="8" fill="#34d399"/>
<text x="94.0" y="700.0" fill="#34d399" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >电力/time-to-power</text>
<text x="318.0" y="698.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >发电、接网、配电、rack power/cooling、EPC交付</text>
<text x="318.0" y="724.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >VST / CEG / TLN / HUBB / ETN / AEIS / NVT / PWR</text>
<text x="878.0" y="714.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >site power 与 rack power 分开；AEIS proof增强但已进入formal reset</text>
  <path d="M 94 764 L 94 788" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="58" y="774" width="1210" height="92" rx="18" fill="#111827" stroke="#f97316" stroke-width="1.8"/>
  <rect x="58" y="774" width="16" height="92" rx="8" fill="#f97316"/>
<text x="94.0" y="806.0" fill="#f97316" font-size="20" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="800" >平台与现金流</text>
<text x="318.0" y="804.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="650" >企业/商家/中国平台入口、AI proof、FCF</text>
<text x="318.0" y="830.0" fill="#cbd5e1" font-size="14" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="400" >SHOP / IBM / Tencent / PDD / JD / BABA</text>
<text x="878.0" y="820.0" fill="#fbbf24" font-size="13" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-weight="400" >Tencent/PDD 仍可分批；SHOP/IBM/JD 当前等 reset/FCF gate</text>
</svg>
