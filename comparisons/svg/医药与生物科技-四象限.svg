    <title>REGN — Regeneron
Buy / staged defensive quality | 总分 19
优势强度 4 / 代价可控度 3.5
平台 biotech 质量仍硬；fianlimab miss 削弱 pipeline optionality，但 Q1 cash-flow spine 没断。回撤到 USD 620-650 更像 staged defensive-quality re-check，不是满仓抄底。</title>
